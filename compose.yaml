services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mediafetch-backend:latest
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:postgresql://db:5432/${DB_NAME}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION: "${JWT_EXPIRATION}"
      FRONTEND_URL: "${FRONTEND_URL}"
    depends_on:
      - db
    networks:
      - app-network
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-network
  
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    image: mediafetch-frontend:latest
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: